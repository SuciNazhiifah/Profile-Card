<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile Card</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Stylesheet -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="card-container">
    <div class="profile-card">
      <!-- Header dengan corak cheetah -->
      <div class="card-header cheetah-pattern"></div>

      <!-- Konten Utama Card -->
      <div class="card-body">
        <!-- Foto Profil Lingkaran -->
        <div class="avatar-container">
          <img 
            src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=500&q=80" 
            alt="Foto Profil" 
            class="profile-img"
          >
        </div>

        <!-- Nama, Umur, & Asal Kota -->
        <h2 class="profile-name">Suci Nazhiifah</h2>
        
        <div class="profile-meta">
          <span class="meta-item badge-age">19 Tahun</span>
          <span class="meta-dot">•</span>
          <span class="meta-item">Aceh, Indonesia</span>
        </div>

        <div class="divider"></div>

        <!-- Informasi Followers, Likes, & Photos -->
        <div class="stats-container">
          <div class="stat-box">
            <span class="stat-number">85.4K</span>
            <span class="stat-label">Followers</span>
          </div>

          <div class="stat-divider"></div>

          <div class="stat-box">
            <span class="stat-number">120K</span>
            <span class="stat-label">Likes</span>
          </div>

          <div class="stat-divider"></div>

          <div class="stat-box">
            <span class="stat-number">342</span>
            <span class="stat-label">Photos</span>
          </div>
        </div>
      </div>
    </div>
  </main>

</body>
</html>
